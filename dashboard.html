function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  if(tab==='zong'){document.querySelector('.tab').classList.add('active');document.getElementById('p-zong').classList.add('on')}
  else if(tab==='fuxi'){document.querySelectorAll('.tab')[1].classList.add('active');document.getElementById('p-fuxi').classList.add('on')}
  else{document.querySelectorAll('.tab')[2].classList.add('active');document.getElementById('p-adj').classList.add('on')}
}

function toggleDetail(idx){
  const row = document.getElementById('row-'+idx);
  const detail = row.querySelector('.kpi-detail');
  const header = row.querySelector('.dim-header');
  if(detail.classList.contains('show')){
    detail.classList.remove('show');
    header.classList.remove('open');
  } else {
    detail.classList.add('show');
    header.classList.add('open');
  }
}

function fmt(v){if(v==null||v==="-")return"-";if(typeof v==="number"){if(Math.abs(v)>=100)return v.toFixed(0);if(Math.abs(v)>=10)return v.toFixed(1);return v.toFixed(2)}return v}
function fmtpct(v){if(v==null||v==="-")return"-";if(typeof v==="number"){const pct=v*100;if(pct>=1000)return">1000%";if(Math.abs(pct)>=100)return pct.toFixed(0)+"%";return pct.toFixed(1)+"%"}return v}
function gradeClass(g){if(g==="A+")return"grade-Aplus";if(g==="A")return"grade-A";if(g==="S")return"grade-S";return"grade-B"}

// 区总渲染
const zongHtml=`<div class="card"><div class="card-title">📊 区总绩效汇总（12人）</div>
<div class="person-row pr-header"><span>区域</span><span>姓名</span><span>等级</span><span>GM得分</span><span>调整后</span><span>维度合计</span></div>`;
DATA.zong.forEach((p,i)=>{
  zongHtml+=`<div class="person-card" id="row-${i}">
  <div class="person-header">
    <div><span class="person-name">${p.name}</span><span class="person-area">(${p.area})</span></div>
    <span class="grade-badge ${gradeClass(p.grade)}">${p.grade}</span>
  </div>
  <div class="scores">
    <div class="score-item"><div class="score-label">GM评分</div><div class="score-value fin">${fmt(p.score_gm)}</div></div>
    <div class="score-item"><div class="score-label">调整后</div><div class="score-value fin">${fmt(p.score_adj)}</div></div>
    <div class="score-item"><div class="score-label">综合得分</div><div class="score-value">${fmt(p.score_total)}</div></div>
    <div class="score-item"><div class="score-label">四大维度</div><div class="score-value">${fmt(p.fin_total+p.cust_total+p.ops_total+p.lrn_total)}</div></div>
  </div>
  <div style="margin-top:12px">
    <div class="dim-header" onclick="toggleDetail(${i})">📋 KPI明细（财务/顾客/运营/学习）▼</div>
    <div class="kpi-detail">
      <div style="background:#fff3e0;padding:8px;border-radius:6px;margin:8px 0">
        <strong style="color:#fa8c16">💰 财务维度（满分30）</strong> → 得分: ${fmt(p.fin_total)}
      </div>`;
  p.fin_kpis.forEach(kpi=>{
    zongHtml+=`<div class="kpi-row"><span>${kpi.name}</span><span>${kpi.name.includes("率")?fmtpct(kpi.val):fmt(kpi.val)}</span></div>`;
  });
  zongHtml+=`<div style="background:#e6f7ff;padding:8px;border-radius:6px;margin:8px 0">
        <strong style="color:#1890ff">👥 顾客维度（满分20）</strong> → 得分: ${fmt(p.cust_total)}
      </div>`;
  p.cust_kpis.forEach(kpi=>{
    zongHtml+=`<div class="kpi-row"><span>${kpi.name}</span><span>${kpi.name.includes("率")?fmtpct(kpi.val):fmt(kpi.val)}</span></div>`;
  });
  zongHtml+=`<div style="background:#f6ffed;padding:8px;border-radius:6px;margin:8px 0">
        <strong style="color:#52c41a">⚙️ 组织运营维度（满分35）</strong> → 得分: ${fmt(p.ops_total)}
      </div>`;
  p.ops_kpis.forEach(kpi=>{
    zongHtml+=`<div class="kpi-row"><span>${kpi.name}</span><span>${kpi.name.includes("率")?fmtpct(kpi.val):fmt(kpi.val)}</span></div>`;
  });
  zongHtml+=`<div style="background:#f9f0ff;padding:8px;border-radius:6px;margin:8px 0">
        <strong style="color:#722ed1">📚 学习与发展维度（满分15）</strong> → 得分: ${fmt(p.lrn_total)}
      </div>`;
  p.lrn_kpis.forEach(kpi=>{
    zongHtml+=`<div class="kpi-row"><span>${kpi.name}</span><span>${fmt(kpi.val)}</span></div>`;
  });
  zongHtml+=`</div></div></div>`;
});
zongHtml+=`</div>`;
document.getElementById('p-zong').innerHTML=zongHtml;

// 区副总渲染
